<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>One Thought</title>
  <meta name="description" content="One useful thought for the day." />
  <meta name="theme-color" content="#141311" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="One Thought" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="icon" type="image/png" href="./icons/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460;9..144,560&family=Outfit:wght@380;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="frame">
    <header>
      <div class="mark">One Thought</div>
      <div id="date-line"></div>
    </header>
    <main>
      <p id="affirmation"></p>
    </main>
    <footer>
      <div id="theme-line"></div>
      <div class="actions">
        <button type="button" id="btn-copy">Copy</button>
        <span class="dot"></span>
        <button type="button" id="btn-another">Another</button>
        <span class="dot"></span>
        <button type="button" id="btn-history">Earlier</button>
        <span class="dot" id="install-dot"></span>
        <button type="button" id="btn-install">Install</button>
      </div>
    </footer>
  </div>
  <div class="sheet" id="sheet-history" hidden>
    <div class="sheet-card">
      <div class="sheet-top">
        <h2>Earlier days</h2>
        <button type="button" data-close="sheet-history">Close</button>
      </div>
      <div id="history-list"></div>
    </div>
  </div>
  <div class="sheet" id="sheet-install" hidden>
    <div class="sheet-card">
      <div class="sheet-top">
        <h2>Add as an app</h2>
        <button type="button" data-close="sheet-install">Close</button>
      </div>
      <div class="how">
        <strong>iPhone</strong>
        <ol>
          <li>Open this page in Safari</li>
          <li>Tap the Share button</li>
          <li>Tap Add to Home Screen</li>
          <li>Tap Add</li>
        </ol>
      </div>
      <div class="how">
        <strong>Android</strong>
        <ol>
          <li>Open this page in Chrome</li>
          <li>Tap the menu</li>
          <li>Tap Add to Home screen or Install app</li>
        </ol>
      </div>
      <button type="button" id="install-native" hidden>Install</button>
    </div>
  </div>
  <script src="./library.js"></script>
  <script src="./app.js"></script>
</body>
</html>
